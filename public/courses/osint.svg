<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="60%" stop-color="#081522" />
      <stop offset="100%" stop-color="#0C1F33" />
    </linearGradient>

    <!-- Theme Gradient -->
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16283A" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#0D9488" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#cyberGrid)" />

  <!-- Ambient Light Cone -->
  <circle cx="400" cy="225" r="280" fill="#0D9488" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="400" cy="210" r="140" fill="#14B8A6" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Outer Cyber Tech Border -->
  <rect x="16" y="16" width="768" height="418" rx="16" fill="none" stroke="#16283A" stroke-width="1.5" />
  <!-- Corner Tech Accents -->
  <path d="M 16 48 L 16 16 L 48 16" fill="none" stroke="#0D9488" stroke-width="3" />
  <path d="M 784 48 L 784 16 L 752 16" fill="none" stroke="#0D9488" stroke-width="3" />
  <path d="M 16 402 L 16 434 L 48 434" fill="none" stroke="#0D9488" stroke-width="3" />
  <path d="M 784 402 L 784 434 L 752 434" fill="none" stroke="#0D9488" stroke-width="3" />

  <!-- Top NISQ Vanguard Brand Header -->
  <g transform="translate(36, 40)">
    <!-- Shield / Wolf Badge -->
    <path d="M 0 0 L 16 -6 L 32 0 L 32 16 C 32 28 16 38 16 38 C 16 38 0 28 0 16 Z" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="1.5" />
    <path d="M 10 12 L 16 6 L 22 12 L 19 22 L 16 26 L 13 22 Z" fill="#5EEAD4" />
    <!-- Brand Typography -->
    <text x="44" y="16" font-family="'Orbitron', 'Inter', monospace, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="2">NISQ VANGUARD</text>
    <text x="44" y="30" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#14B8A6" letter-spacing="1.5">ACADEMY // RECONNAISSANCE</text>
  </g>

  <!-- Track Badge (Top Right) -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="6" fill="#081522" stroke="#0D9488" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="14" r="4" fill="#14B8A6">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">OSINT RECON</text>
  </g>

  <!-- Central Topic Illustration Area -->
  <g transform="translate(400, 215)">
    
      <!-- Satellite / Radar Dish Scanner -->
      <path d="M -60 20 A 70 70 0 0 1 40 -60" fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round" />
      <path d="M -45 28 A 55 55 0 0 1 30 -42" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" />
      <!-- Dish Focal Antenna -->
      <line x1="-15" y1="-15" x2="45" y2="35" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="45" cy="35" r="7" fill="#5EEAD4" />
      <!-- Radio Wave Emitters -->
      <path d="M 55 25 A 20 20 0 0 1 65 45" fill="none" stroke="#5EEAD4" stroke-width="2" />
      <path d="M 65 15 A 35 35 0 0 1 80 55" fill="none" stroke="#5EEAD4" stroke-width="2" />
      <!-- Scanner Lens -->
      <circle cx="-50" cy="-40" r="14" fill="#081522" stroke="#14B8A6" stroke-width="2" />
      <text x="-50" y="-36" font-family="monospace" font-size="10" font-weight="bold" fill="#5EEAD4" text-anchor="middle">GEO</text>
    
  </g>

  <!-- Bottom Title Overlay Bar -->
  <g transform="translate(36, 385)">
    <!-- Glow line -->
    <line x1="0" y1="-18" x2="728" y2="-18" stroke="#16283A" stroke-width="1" />
    <line x1="0" y1="-18" x2="160" y2="-18" stroke="url(#themeGrad)" stroke-width="2" />
    
    <!-- Title Text -->
    <text x="0" y="6" font-family="'Orbitron', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">OSINT (Intelligence)</text>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Open Source Intelligence · Dorking · Identity Recon · Metadata</text>
  </g>
</svg>