<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="60%" stop-color="#081522" />
      <stop offset="100%" stop-color="#0C1F33" />
    </linearGradient>

    <!-- Theme Gradient -->
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A7CFF" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16283A" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#0A7CFF" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#cyberGrid)" />

  <!-- Ambient Light Cone -->
  <circle cx="400" cy="225" r="280" fill="#0A7CFF" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="400" cy="210" r="140" fill="#00B8FF" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Outer Cyber Tech Border -->
  <rect x="16" y="16" width="768" height="418" rx="16" fill="none" stroke="#16283A" stroke-width="1.5" />
  <!-- Corner Tech Accents -->
  <path d="M 16 48 L 16 16 L 48 16" fill="none" stroke="#0A7CFF" stroke-width="3" />
  <path d="M 784 48 L 784 16 L 752 16" fill="none" stroke="#0A7CFF" stroke-width="3" />
  <path d="M 16 402 L 16 434 L 48 434" fill="none" stroke="#0A7CFF" stroke-width="3" />
  <path d="M 784 402 L 784 434 L 752 434" fill="none" stroke="#0A7CFF" stroke-width="3" />

  <!-- Top NISQ Vanguard Brand Header -->
  <g transform="translate(36, 40)">
    <!-- Shield / Wolf Badge -->
    <path d="M 0 0 L 16 -6 L 32 0 L 32 16 C 32 28 16 38 16 38 C 16 38 0 28 0 16 Z" fill="#0A7CFF" fill-opacity="0.2" stroke="#0A7CFF" stroke-width="1.5" />
    <path d="M 10 12 L 16 6 L 22 12 L 19 22 L 16 26 L 13 22 Z" fill="#38BDF8" />
    <!-- Brand Typography -->
    <text x="44" y="16" font-family="'Orbitron', 'Inter', monospace, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="2">NISQ VANGUARD</text>
    <text x="44" y="30" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00B8FF" letter-spacing="1.5">ACADEMY // CORE FOUNDATIONS</text>
  </g>

  <!-- Track Badge (Top Right) -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="6" fill="#081522" stroke="#0A7CFF" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="14" r="4" fill="#00B8FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">FOUNDATION</text>
  </g>

  <!-- Central Topic Illustration Area -->
  <g transform="translate(400, 215)">
    
      <!-- Shield Triad -->
      <path d="M -70 -70 L 0 -110 L 70 -70 L 70 30 C 70 85 0 120 0 120 C 0 120 -70 85 -70 30 Z" fill="#0A7CFF" fill-opacity="0.12" stroke="#0A7CFF" stroke-width="3" />
      <path d="M -50 -50 L 0 -80 L 50 -50 L 50 20 C 50 65 0 95 0 95 C 0 95 -50 65 -50 20 Z" fill="none" stroke="#00B8FF" stroke-width="1.8" stroke-dasharray="6,4" />
      <!-- Triad Core Nodes -->
      <circle cx="0" cy="-35" r="18" fill="#081522" stroke="#38BDF8" stroke-width="2.5" />
      <text x="0" y="-30" font-family="monospace" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">C</text>
      <circle cx="-32" cy="25" r="18" fill="#081522" stroke="#38BDF8" stroke-width="2.5" />
      <text x="-32" y="30" font-family="monospace" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">I</text>
      <circle cx="32" cy="25" r="18" fill="#081522" stroke="#38BDF8" stroke-width="2.5" />
      <text x="32" y="30" font-family="monospace" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">A</text>
      <!-- Connecting Energy Lines -->
      <line x1="0" y1="-17" x2="-22" y2="12" stroke="#00B8FF" stroke-width="2" />
      <line x1="0" y1="-17" x2="22" y2="12" stroke="#00B8FF" stroke-width="2" />
      <line x1="-14" y1="25" x2="14" y2="25" stroke="#00B8FF" stroke-width="2" />
      <circle cx="0" cy="5" r="6" fill="#FFFFFF" />
    
  </g>

  <!-- Bottom Title Overlay Bar -->
  <g transform="translate(36, 385)">
    <!-- Glow line -->
    <line x1="0" y1="-18" x2="728" y2="-18" stroke="#16283A" stroke-width="1" />
    <line x1="0" y1="-18" x2="160" y2="-18" stroke="url(#themeGrad)" stroke-width="2" />
    
    <!-- Title Text -->
    <text x="0" y="6" font-family="'Orbitron', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Cybersecurity Foundations</text>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.5">CIA Triad · Kill Chain · Threat Principles · SOC Defense</text>
  </g>
</svg>