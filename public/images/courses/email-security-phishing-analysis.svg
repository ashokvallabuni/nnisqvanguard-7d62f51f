<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filter Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern Background -->
    <pattern id="cyber-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0E2238" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="60" cy="60" r="1.5" fill="#0EA5E9" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  
  <!-- Cyber Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#cyber-grid)" opacity="0.85"/>
  
  <!-- Ambient Center Lighting -->
  <circle cx="960" cy="540" r="700" fill="url(#center-glow)"/>

  <!-- High-Tech Circuit Traces (Isometric Accents) -->
  <g opacity="0.25" stroke="#0EA5E9" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 400 200 L 550 350 L 800 350"/>
    <circle cx="100" cy="200" r="4" fill="#0EA5E9"/>
    <circle cx="800" cy="350" r="4" fill="#0EA5E9"/>
    
    <path d="M 1820 880 L 1520 880 L 1370 730 L 1120 730"/>
    <circle cx="1820" cy="880" r="4" fill="#10B981"/>
    <circle cx="1120" cy="730" r="4" fill="#10B981"/>
    
    <path d="M 1500 150 L 1650 300 L 1800 300"/>
    <path d="M 200 900 L 350 750 L 500 750"/>
  </g>

  <!-- Header HUD Data Overlay -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#0EA5E9" opacity="0.85">
    <!-- Top Left Status -->
    <rect x="80" y="70" width="10" height="10" fill="#0EA5E9"/>
    <text x="105" y="80" font-weight="bold" letter-spacing="2">NISQ VANGUARD // CYBER ACADEMY</text>
    <text x="105" y="105" fill="#64748B" font-size="13" letter-spacing="1">CURRICULUM ARCHITECTURE • OFFICIAL TRACK ASSET</text>

    <!-- Top Right Telemetry -->
    <text x="1840" y="80" text-anchor="end" font-weight="bold" letter-spacing="2">SEC_LEVEL // AUTH-OK</text>
    <text x="1840" y="105" text-anchor="end" fill="#64748B" font-size="13" letter-spacing="1">SYS_VER: 2026.4 • ENCRYPTION: SHA256/AES-GCM</text>
  </g>

  <!-- Central Visual Container (Isometric Hologram) -->
  <g transform="translate(960, 480)">
    <!-- Outer Hexagonal Halo -->
    <polygon points="0,-240 208,-120 208,120 0,240 -208,120 -208,-120" 
             fill="none" stroke="#0EA5E9" stroke-width="2.5" opacity="0.4" 
             filter="url(#neon-glow)"/>
    <polygon points="0,-210 182,-105 182,105 0,210 -182,105 -182,-105" 
             fill="#050B14" fill-opacity="0.7" stroke="#10B981" stroke-width="1.2" opacity="0.6"/>

    <!-- Concentric Orbit Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="8 12" opacity="0.5"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="14 18" opacity="0.65"/>
    
    <!-- Central Energy Core -->
    <circle cx="0" cy="0" r="80" fill="url(#accent-grad)" opacity="0.22" filter="url(#neon-glow)"/>
    
    <!-- Core Icon Silhouette Geometry -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
      <!-- Shield Base -->
      <path d="M 0 -60 L 50 -35 L 50 15 C 50 55 0 80 0 80 C 0 80 -50 55 -50 15 L -50 -35 Z"/>
      <!-- Internal Nodes -->
      <path d="M 0 -30 L 0 50 M -25 0 L 25 0" stroke="#0EA5E9" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="4" fill="#0EA5E9"/>
      <circle cx="0" cy="50" r="4" fill="#0EA5E9"/>
      <circle cx="-25" cy="0" r="4" fill="#10B981"/>
      <circle cx="25" cy="0" r="4" fill="#10B981"/>
    </g>

    <!-- Radar Sweep Coordinates -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#0EA5E9" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#0EA5E9" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3"/>
  </g>

  <!-- Bottom Course Metadata Presentation Card -->
  <g transform="translate(960, 840)">
    <!-- Pill Badge -->
    <rect x="-180" y="-85" width="360" height="34" rx="17" fill="#0A1E34" stroke="#0EA5E9" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#0EA5E9" letter-spacing="3">
      MODULE 79 • SOC &AMP; DEFENSE
    </text>

    <!-- Main Title -->
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Email Security &amp; Phishing Analysis
    </text>

    <!-- Subtitle / Topics -->
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      SPF, DKIM, DMARC Authentication, Header Analysis
    </text>
  </g>

  <!-- Border Frame Accents -->
  <rect x="40" y="40" width="1840" height="1000" rx="16" fill="none" stroke="#162E4A" stroke-width="1.5" opacity="0.6"/>
  <!-- Corner Brackets -->
  <path d="M 40 90 L 40 40 L 90 40" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <path d="M 1880 90 L 1880 40 L 1830 40" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <path d="M 40 990 L 40 1040 L 90 1040" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <path d="M 1880 990 L 1880 1040 L 1830 1040" fill="none" stroke="#0EA5E9" stroke-width="3"/>
</svg>